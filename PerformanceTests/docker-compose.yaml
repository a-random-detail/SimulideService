version: "3.8"

services:
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-storage:/var/lib/influxdb

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - influxdb

  k6:
    image: grafana/k6
    container_name: k6
    volumes:
      - ./performance-test.js:/performance-test.js
    depends_on:
      - influxdb
    command: [
      "run", "/performance-test.js",
      "--out", "influxdb=http://influxdb:8086/k6"
    ]

volumes:
  influxdb-storage:
  grafana-storage:
