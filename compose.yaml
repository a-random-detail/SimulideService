services:
  service:
    image: simulideservice
    build:
      context: .
      dockerfile: SimulideService/Dockerfile
    environment:
      DB_HOST: postgres 
      DB_PORT: 5432
      DB_NAME: simulide-db 
      DB_USER: simulide
      DB_PASSWORD: simulide-pw
      DB_POOLING: "true"
      DB_MIN_POOL_SIZE: "1"
      DB_MAX_POOL_SIZE: "20"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - simulide-net

  postgres:
    image: postgres:14.6-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: simulide-db
      POSTGRES_USER: simulide 
      POSTGRES_PASSWORD: simulide-pw
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql 
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
    networks:
      - simulide-net
volumes:
  postgres-data:

networks:
    simulide-net:
      driver: bridge
