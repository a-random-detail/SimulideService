services:
  simulideservice:
    image: simulideservice
    build:
      context: .
      dockerfile: SimulideService/Dockerfile
    environment:
      DB_HOST: simulide-db 
      DB_PORT: 5432
      DB_NAME: simulide 
      DB_USER: simulide-user
      DB_PASSWORD: simulide-pw 
      DB_POOLING: "true"
      DB_MIN_POOL_SIZE: "1"
      DB_MAX_POOL_SIZE: "20"
    depends_on:
      - simulide-db
    ports:
      - "8080:8080"
    networks:
      - simulide-net
  simulide-db:
    image: postgres:14.6-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: simulide
      POSTGRES_USER: simulide-user
      POSTGRES_PASSWORD: simulide-pw
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - simulide-net
volumes:
  db:
    driver: local

networks:
    simulide-net:
      driver: bridge
